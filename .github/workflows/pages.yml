# The demo desktop and the component registry on GitHub Pages (registry at
# <site>/r/<item>.json). Where the site lives comes from GitHub itself:
# /Patina under the account's Pages domain, or the root of a custom domain.
# Needs Settings › Pages › Source set to "GitHub Actions" once.
#
# Deployed when a release is published, from that release: the registry is
# what `npx @pat1na/cli init` installs, so between releases it must stay the
# last release, not whatever main holds. A release asks for this run (Tell
# the sites, notify-sites.yml); it runs on main, as the github-pages
# environment lets only main deploy, and builds the release's tag. Run it by
# hand to redeploy: the tag you give, or the latest release.
name: GitHub Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to deploy (empty: the latest)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The release's files, not main's.
      - name: Check out the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          tag="${TAG:-$(gh release view --json tagName --jq .tagName)}"
          git checkout --detach "refs/tags/$tag"
          echo "Deploying $tag ($(git rev-parse --short HEAD))."
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      # Pages answers https once it has a certificate; ask for it by name.
      - id: site
        run: |
          url='${{ steps.pages.outputs.base_url }}'
          echo "url=${url/#http:/https:}" >> "$GITHUB_OUTPUT"
      # The registry's items point at each other by URL: point them here.
      - run: npm run registry:build
        env:
          PATINA_REGISTRY: ${{ steps.site.outputs.url }}/r
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.site.outputs.url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
