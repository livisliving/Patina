# The demo desktop and the component registry on GitHub Pages (registry at
# <site>/r/<item>.json). Where the site lives comes from GitHub itself:
# /Patina under the account's Pages domain, or the root of a custom domain.
# Needs Settings › Pages › Source set to "GitHub Actions" once.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      # Pages answers https once it has a certificate; ask for it by name.
      - id: site
        run: |
          url='${{ steps.pages.outputs.base_url }}'
          echo "url=${url/#http:/https:}" >> "$GITHUB_OUTPUT"
      # The registry's items point at each other by URL: point them here.
      - run: npm run registry:build
        env:
          PATINA_REGISTRY: ${{ steps.site.outputs.url }}/r
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.site.outputs.url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
