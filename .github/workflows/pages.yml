# The demo desktop and the component registry on GitHub Pages:
# https://livisliving.github.io/patina/ (registry at …/patina/r/<item>.json).
# Needs Settings › Pages › Source set to "GitHub Actions" once.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The registry's items point at each other by URL: point them here.
      - run: npm run registry:build
        env:
          PATINA_REGISTRY: https://livisliving.github.io/patina/r
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
